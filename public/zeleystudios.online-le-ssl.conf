<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName zeleystudios.online
    ServerAlias www.zeleystudios.online
    DocumentRoot /var/www/zeley

    <Directory /var/www/zeley>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/zeleystudios_error.log
    CustomLog ${APACHE_LOG_DIR}/zeleystudios_access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/zeleystudios.online/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/zeleystudios.online/privkey.pem
</VirtualHost>
</IfModule>
