<VirtualHost *:80>
    ServerName zeleystudios.online
    ServerAlias www.zeleystudios.online
    DocumentRoot /var/www/zeley

    <Directory /var/www/zeley>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/zeleystudios_error.log
    CustomLog ${APACHE_LOG_DIR}/zeleystudios_access.log combined
RewriteEngine on
RewriteCond %{SERVER_NAME} =www.zeleystudios.online [OR]
RewriteCond %{SERVER_NAME} =zeleystudios.online
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
